# fly.toml app configuration file generated for 3jrpg on 2026-08-02T20:37:16Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = '3jrpg'
primary_region = 'iad'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

[[vm]]
  memory = '768mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 768
  processes = ['app']
  size = 'shared-cpu-1x'
